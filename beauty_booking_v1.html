<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>美業預約管理 V1</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#292633;background:#f7f5f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#7d7786;font-size:13px}.brand{font-size:23px;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;padding:16px 0}.tabs button,.small{border:1px solid #e4dfe8;background:white;border-radius:12px;padding:10px 13px;white-space:nowrap}.tabs button.active,.primary{background:#5c466f;color:white;border:0}.primary{border-radius:11px;padding:11px 15px}.panel{background:#fff;border:1px solid #ebe7ee;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #37244508}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tools h2{margin:0 auto 0 0;font-size:19px}.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dayname{text-align:center;font-size:12px;color:#81788b;padding:8px 0}.day{min-height:88px;background:#faf8fb;border:1px solid #eee9f0;border-radius:9px;padding:6px;text-align:left;color:inherit}.day.today{border:2px solid #795a95}.day.selected{background:#efe8f4}.day .num{font-weight:700;font-size:13px}.pill{display:block;font-size:10px;background:#e6d9ef;padding:3px 5px;border-radius:5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.appt{display:flex;gap:12px;border-left:4px solid #9b7db5;background:#f8f4fa;padding:12px;margin:8px 0;border-radius:9px;align-items:center}.appt .details{flex:1}.appt b{display:block}.appt small{color:#777}.empty{padding:28px;text-align:center;color:#999}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#f6f0f8;padding:15px;border-radius:12px}.stat strong{font-size:24px;display:block}dialog{border:0;border-radius:18px;box-shadow:0 20px 80px #20172b55;width:min(520px,94vw);max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#21182b88}form{display:grid;gap:11px}label{font-size:13px;font-weight:650;display:grid;gap:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #dcd5e1;border-radius:9px;background:#fff}textarea{min-height:65px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.danger{background:#fff1f1;color:#a32626;border:1px solid #efcaca}.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.item:last-child{border-bottom:0}.hidden{display:none!important}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekcol{min-height:170px;background:#faf8fb;border:1px solid #eee;border-radius:9px;padding:6px;font-size:11px}.weekcol .pill{white-space:normal}.notice{padding:12px;background:#f3edf6;border-radius:9px;font-size:13px}.toolbarRight{margin-left:auto}@media(max-width:600px){.shell{padding:12px}.day{min-height:67px;padding:3px}.pill{font-size:9px}.brand{font-size:19px}.weekcol{padding:3px}.tools h2{width:100%}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">✦ 美業預約管家 <span class="muted">V1.0</span></div><div class="muted">美甲 · 美睫 · 紋繡｜個人工作室</div></div><button class="primary" onclick="openBooking()">＋ 新增預約</button></header><nav class="tabs" id="tabs"></nav><section id="page"></section></main>
<dialog id="modal"><form id="bookingForm" onsubmit="saveBooking(event)"><h2 id="modalTitle">新增預約</h2><input type="hidden" id="bid"><label>顧客姓名<input id="customer" required maxlength="60" placeholder="輸入姓名"></label><label>聯絡電話<input id="phone" type="tel" placeholder="選填"></label><label>服務項目<select id="service" required onchange="syncDuration()"></select></label><div class="row"><label>日期<input id="date" type="date" required></label><label>開始時間<input id="time" type="time" required step="900"></label></div><label>服務時間（分鐘）<input id="duration" type="number" min="15" max="720" step="15" required></label><label>狀態<select id="status"><option value="已確認">已確認</option><option value="待確認">待確認</option><option value="已完成">已完成</option><option value="已取消">已取消</option></select></label><label>備註<textarea id="note" placeholder="LINE 名稱、注意事項等"></textarea></label><div class="row"><button type="button" class="small" onclick="closeModal()">返回</button><button type="submit" class="primary">儲存預約</button></div><button type="button" id="deleteBtn" class="small danger hidden" onclick="deleteBooking()">刪除此預約</button></form></dialog>
<dialog id="serviceModal"><form onsubmit="saveService(event)"><h2>服務項目</h2><input type="hidden" id="sid"><label>服務名稱<input id="sname" required maxlength="70"></label><label>類別<select id="scategory"><option>美甲</option><option>美睫</option><option>紋繡</option><option>其他</option></select></label><div class="row"><label>價格（NT$）<input id="sprice" type="number" min="0" required></label><label>時間（分鐘）<input id="sduration" type="number" min="15" max="720" step="15" required></label></div><div class="row"><button type="button" class="small" onclick="serviceModal.close()">返回</button><button class="primary">儲存</button></div></form></dialog>
<script>
const KEY='beauty-booking-v1';const defaults={bookings:[],services:[{id:'s1',name:'單色凝膠美甲',category:'美甲',price:1000,duration:90},{id:'s2',name:'造型凝膠美甲',category:'美甲',price:1500,duration:120},{id:'s3',name:'自然款美睫',category:'美睫',price:1200,duration:90},{id:'s4',name:'濃密款美睫',category:'美睫',price:1600,duration:120},{id:'s5',name:'霧眉諮詢',category:'紋繡',price:0,duration:30},{id:'s6',name:'霧眉服務',category:'紋繡',price:6000,duration:180}],settings:{staff:'工作室主理人',line:'',start:'09:00',end:'20:00',closed:[]}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};db.settings??=structuredClone(defaults.settings);db.bookings??=[];db.services??=structuredClone(defaults.services);let tab='calendar',view='month',focus=new Date(),selected=fmt(new Date());const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('瀏覽器無法儲存資料，請確認不是受限制的瀏覽模式')}}function fmt(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dateOf(s){return new Date(s+'T12:00:00')}function shift(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function timeNum(t){let [h,m]=t.split(':').map(Number);return h*60+m}function activeBookings(){return db.bookings.filter(b=>b.status!=='已取消')}function serviceName(id){return db.services.find(s=>s.id===id)?.name||'已刪除服務'}function entries(day){return db.bookings.filter(b=>b.date===day).sort((a,b)=>a.time.localeCompare(b.time))}function money(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW')}function render(){const labels=[['calendar','行事曆'],['bookings','預約管理'],['services','服務管理'],['customers','顧客'],['settings','工作室設定']];$('tabs').innerHTML=labels.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${t}</button>`).join('');$('page').innerHTML=tab==='calendar'?calendar():tab==='bookings'?bookingsPage():tab==='services'?servicesPage():tab==='customers'?customersPage():settingsPage()}
function calendar(){let html=`<div class="panel"><div class="tools"><h2>📅 預約行事曆</h2><button class="small" onclick="navigate(-1)">‹</button><button class="small" onclick="focus=new Date();selected=fmt(focus);render()">今天</button><button class="small" onclick="navigate(1)">›</button><select style="width:auto" onchange="view=this.value;render()"><option value="month" ${view==='month'?'selected':''}>月</option><option value="week" ${view==='week'?'selected':''}>週</option><option value="day" ${view==='day'?'selected':''}>日</option></select></div><h3>${focus.getFullYear()} 年 ${focus.getMonth()+1} 月 ${view==='day'?' '+focus.getDate()+' 日':''}</h3>`;if(view==='month'){let start=new Date(focus.getFullYear(),focus.getMonth(),1),offset=start.getDay(),count=new Date(focus.getFullYear(),focus.getMonth()+1,0).getDate();html+='<div class="grid7">'+['日','一','二','三','四','五','六'].map(d=>`<div class="dayname">${d}</div>`).join('');for(let i=0;i<Math.ceil((count+offset)/7)*7;i++){let n=i-offset+1;if(n<1||n>count){html+='<div></div>';continue}let d=fmt(new Date(focus.getFullYear(),focus.getMonth(),n)),a=entries(d).filter(b=>b.status!=='已取消');html+=`<button class="day ${d===fmt(new Date())?'today':''} ${d===selected?'selected':''}" onclick="selected='${d}';render()"><span class="num">${n}</span>${a.slice(0,3).map(b=>`<span class="pill">${esc(b.time)} ${esc(b.customer)}</span>`).join('')}${a.length>3?`<span class="muted">+${a.length-3}</span>`:''}</button>`}html+='</div>'}else if(view==='week'){let start=shift(focus,-focus.getDay());html+='<div class="week">';for(let i=0;i<7;i++){let d=fmt(shift(start,i));html+=`<div class="weekcol"><button class="small" style="width:100%;padding:4px" onclick="selected='${d}';focus=dateOf('${d}');view='day';render()">${d.slice(5)}</button>${entries(d).filter(b=>b.status!=='已取消').map(b=>`<button class="pill" style="border:0;width:100%;text-align:left" onclick="editBooking('${b.id}')">${esc(b.time)} ${esc(b.customer)}</button>`).join('')}</div>`}html+='</div>'}html+='</div>';let day=view==='day'?fmt(focus):selected;html+=`<div class="panel"><div class="tools"><h2>${day} 的預約</h2><button class="primary" onclick="openBooking('${day}')">＋ 新增</button></div>`;let list=entries(day);html+=list.length?list.map(b=>bookingCard(b)).join(''):'<div class="empty">當天沒有預約</div>';return html+'</div>'}
function navigate(dir){if(view==='month')focus=new Date(focus.getFullYear(),focus.getMonth()+dir,1);else focus=shift(focus,dir*(view==='week'?7:1));selected=fmt(focus);render()}function bookingCard(b){return `<div class="appt"><div><b>${esc(b.time)}</b><small>${b.duration} 分</small></div><div class="details"><b>${esc(b.customer)} <small>｜${esc(b.status)}</small></b><small>${esc(serviceName(b.serviceId))} · ${esc(b.phone)}</small></div><button class="small" onclick="editBooking('${b.id}')">編輯</button></div>`}function bookingsPage(){return `<div class="panel"><div class="tools"><h2>所有預約（${db.bookings.length}）</h2><button class="primary" onclick="openBooking()">＋ 新增</button></div>${db.bookings.length?db.bookings.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(b=>`<div><div class="muted">${esc(b.date)}</div>${bookingCard(b)}</div>`).join(''):'<div class="empty">尚無預約</div>'}</div>`}
function servicesPage(){return `<div class="panel"><div class="tools"><h2>服務項目</h2><button class="primary" onclick="openService()">＋ 新增服務</button></div>${db.services.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.category)} · ${s.duration} 分鐘 · ${money(s.price)}</div></div><div><button class="small" onclick="openService('${s.id}')">編輯</button> <button class="small danger" onclick="removeService('${s.id}')">刪除</button></div></div>`).join('')}</div>`}
function customersPage(){let map=new Map();db.bookings.forEach(b=>{let k=b.phone?.trim()||b.customer.trim();if(!map.has(k))map.set(k,{name:b.customer,phone:b.phone,count:0});map.get(k).count++});return `<div class="panel"><h2>顧客紀錄</h2><p class="muted">由預約資料自動建立顧客清單；同電話視為同一顧客。</p>${[...map.values()].map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'未填電話')} · ${c.count} 筆預約</div></div></div>`).join('')||'<div class="empty">新增第一筆預約後，顧客會出現在這裡</div>'}</div>`}
function settingsPage(){let s=db.settings;return `<div class="panel"><h2>工作室設定</h2><form onsubmit="saveSettings(event)"><label>員工／主理人名稱<input name="staff" value="${esc(s.staff)}" required></label><div class="row"><label>營業開始<input name="start" type="time" value="${esc(s.start)}" required></label><label>營業結束<input name="end" type="time" value="${esc(s.end)}" required></label></div><label>固定公休日（可複選）</label><div class="row" style="flex-wrap:wrap">${['日','一','二','三','四','五','六'].map((d,i)=>`<label style="display:block;flex:0 0 auto"><input type="checkbox" name="closed" value="${i}" ${s.closed.includes(i)?'checked':''} style="width:auto">週${d}</label>`).join('')}</div><label>LINE 官方帳號網址<input name="line" type="url" placeholder="https://lin.ee/..." value="${esc(s.line)}"></label><div class="notice">此版本僅儲存 LINE 官方帳號網址，不會自動發送 LINE 訊息。LINE Login、LIFF、Messaging API 及顧客自助預約需串接後端。</div><button class="primary">儲存設定</button></form></div><div class="panel"><h3>資料備份</h3><div class="row"><button class="small" onclick="exportData()">匯出 JSON 備份</button><label class="small" style="text-align:center">匯入備份<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div><p class="muted">資料只保存在此瀏覽器。清除網站資料或更換裝置可能造成資料遺失，請定期備份。</p></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);if(timeNum(f.get('end'))<=timeNum(f.get('start')))return alert('結束時間必須晚於開始時間');db.settings={staff:f.get('staff'),start:f.get('start'),end:f.get('end'),line:f.get('line'),closed:f.getAll('closed').map(Number)};persist();render();alert('設定已儲存')}
function openBooking(day){$('bookingForm').reset();$('bid').value='';$('modalTitle').textContent='新增預約';$('deleteBtn').classList.add('hidden');$('service').innerHTML=db.services.map(s=>`<option value="${esc(s.id)}">${esc(s.category)}｜${esc(s.name)}</option>`).join('');$('date').value=day||selected;$('time').value='10:00';syncDuration();$('modal').showModal()}function editBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;openBooking(b.date);$('bid').value=b.id;$('modalTitle').textContent='編輯預約';['customer','phone','date','time','duration','status','note'].forEach(k=>$(k).value=b[k]??'');$('service').value=b.serviceId;$('deleteBtn').classList.remove('hidden')}function syncDuration(){let s=db.services.find(x=>x.id===$('service').value);if(s)$('duration').value=s.duration}function closeModal(){$('modal').close()}function saveBooking(e){e.preventDefault();let id=$('bid').value||crypto.randomUUID(),b={id,customer:$('customer').value.trim(),phone:$('phone').value.trim(),serviceId:$('service').value,date:$('date').value,time:$('time').value,duration:Number($('duration').value),status:$('status').value,note:$('note').value};let start=timeNum(b.time),end=start+b.duration;if(b.status!=='已取消'){if(db.settings.closed.includes(dateOf(b.date).getDay()))return alert('這天是固定公休日');if(start<timeNum(db.settings.start)||end>timeNum(db.settings.end))return alert('預約時間超出營業時間');let conflict=activeBookings().find(x=>x.id!==id&&x.date===b.date&&start<timeNum(x.time)+Number(x.duration)&&end>timeNum(x.time));if(conflict)return alert('時間衝突：'+conflict.customer+' '+conflict.time)}let idx=db.bookings.findIndex(x=>x.id===id);if(idx>=0)db.bookings[idx]=b;else db.bookings.push(b);selected=b.date;focus=dateOf(b.date);persist();closeModal();render()}function deleteBooking(){if(!confirm('確定永久刪除這筆預約？'))return;db.bookings=db.bookings.filter(b=>b.id!==$('bid').value);persist();closeModal();render()}
function openService(id){$('serviceModal').querySelector('form').reset();let s=db.services.find(x=>x.id===id);$('sid').value=s?.id||'';$('sname').value=s?.name||'';$('scategory').value=s?.category||'美甲';$('sprice').value=s?.price??1000;$('sduration').value=s?.duration??60;$('serviceModal').showModal()}function saveService(e){e.preventDefault();let id=$('sid').value||crypto.randomUUID(),s={id,name:$('sname').value.trim(),category:$('scategory').value,price:Number($('sprice').value),duration:Number($('sduration').value)};let idx=db.services.findIndex(x=>x.id===id);if(idx>=0)db.services[idx]=s;else db.services.push(s);persist();$('serviceModal').close();render()}function removeService(id){if(db.bookings.some(b=>b.serviceId===id))return alert('此服務已有預約紀錄，無法刪除。請先修改相關預約。');if(!confirm('確定刪除此服務？'))return;db.services=db.services.filter(s=>s.id!==id);persist();render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beauty-booking-backup-'+fmt(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.bookings)||!Array.isArray(obj.services)||!obj.settings)throw Error('格式錯誤');if(!confirm('匯入會覆蓋目前全部資料，確定嗎？'))return;db=obj;persist();render();alert('匯入成功')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''}render();
</script></body></html>
